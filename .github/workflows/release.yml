# main に push されたとき、manifest.json の version のリリース（v1.5.0 など）がまだ無ければ
# TubeTunes.zip を作って Releases に公開する（タグもここで作る）。
# Actions タブの「Run workflow」から手動でも実行できる。
name: Release

on:
  push:
    branches: [main]
    paths:
      - 'manifest.json'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: バージョンを読む
        id: ver
        run: |
          V=$(jq -r .version manifest.json)
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          echo "manifest version: $V"

      - name: 既に同じバージョンのリリースがあるか確認
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.ver.outputs.tag }}" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "${{ steps.ver.outputs.tag }} は公開済みなのでスキップ"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: zip を作成
        if: steps.exists.outputs.found == 'false'
        run: |
          mkdir -p dist/TubeTunes
          cp -r manifest.json *.js *.css icons dist/TubeTunes/
          cd dist && zip -r TubeTunes.zip TubeTunes

      - name: Release を作成
        if: steps.exists.outputs.found == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n\n%s\n' \
            "TubeTunes.zip をダウンロードして展開し、拡張機能の管理画面の「パッケージ化されていない拡張機能を読み込む」でフォルダを選んでください。" \
            "拡張機能ID: foogjnjpclbidngnjhbbidfclkpoilhj" > notes.md
          gh release create "${{ steps.ver.outputs.tag }}" dist/TubeTunes.zip \
            --target "$GITHUB_SHA" \
            --title "TubeTunes ${{ steps.ver.outputs.tag }}" \
            --notes-file notes.md
